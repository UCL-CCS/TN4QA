[project]
name = "tn4qa"
version = "0.0.22"
description = "A Python package to integrate tensor network methods with quantum algorithms."
authors = [
    {name="Angus Mingare",  email="angus.mingare.22@ucl.ac.uk"},
    {name="Isabelle Heuzé", email="isabelle.heuze.24@ucl.ac.uk"}
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.11, <3.12"
dependencies = [
    "sparse>=0.15.4, <0.16",
    "qiskit>=2.0.0",
    "qiskit-ibm-runtime>=0.34.0",
    "qiskit-aer>=0.15.1",
    "qiskit-algorithms>=0.3.1",
    "cotengra>=0.6.2",
    "scipy>=1.15.0, <1.16.2",
    "numpy>=2.1, <3",
    "cotengrust>=0.1.4",
    "matplotlib>=3.10.1",
    "cached-property>=1.5.2",
    "scikit-learn>=1.3.0",
    "kahypar>=1.3.6",
    "networkx>=3.6.1",
    "iqm-client>=22.4",
    "optuna>=4.8.0",
    "block2==0.5.3rc18",
]

[tool.uv.sources]
block2 = { index = "block2-preview" }

[[tool.uv.index]]
name = "block2-preview"
url = "https://block-hczhai.github.io/block2-preview/pypi/"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "coverage>=7.13.1",
    "ipykernel>=7.1.0",
    "mypy>=1.19.1",
    "myst-parser>=5.0.0",
    "poetry>=2.3.0",
    "pre-commit>=4.5.1",
    "pyscf>=2.11.0",
    "pytest>=9.0.2",
    "pytest-xdist>=3.8.0",
    "ruff>=0.14.13",
    "sphinx>=9.0.4",
]

[tool.ruff]
exclude = ["notebooks/"]
line-length = 88
indent-width = 4

[tool.ruff.lint]
select = [
    "E4", "E7", "E9",
    "F",
    #"D", #pydocstyle (lets add this when we actually write docstrings)
    "I", #isort
]

ignore = ["E741"]

[tool.ruff.lint.pydocstyle]
convention = "google"
